name: CI
on:
  push:
    branches: [main, security/phase-2-hardening]
  pull_request:
    branches: [main]
jobs:
  lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/security/phase-2-hardening'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and commit package lock if missing
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already committed."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts
          node -e "const p=require('./package-lock.json'); if(p.lockfileVersion!==3 || !p.packages?.['node_modules/react'] || !p.packages?.['node_modules/@supabase/supabase-js']) process.exit(1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: commit reproducible npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - run: npm audit --audit-level=high
      - run: node --test tests/push-endpoint.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --no-lock supabase/functions/cadence-push/index.ts
      - run: npm run typecheck
      - run: npm run build
