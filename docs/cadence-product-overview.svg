  <text x="1216" y="793" fill="#827591" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="end" letter-spacing="1.1">ILLUSTRATION ONLY · NOT A CAPTURE OF THE LIVE INTERFACE</text>
