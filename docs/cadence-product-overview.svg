<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Cadence product overview illustration</title>
  <desc id="desc">A dark, violet-accented habit and task workspace showing daily habits, a task list, a weekly consistency chart, and focus-session progress. This is an illustration rather than a live application screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#09080f"/><stop offset="1" stop-color="#151025"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9f72ec"/><stop offset="1" stop-color="#6b3db8"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#191426"/><stop offset="1" stop-color="#110f19"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#8e5ad7" stop-opacity=".24"/><stop offset="1" stop-color="#8e5ad7" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1280" height="820" rx="30" fill="url(#bg)"/>
  <ellipse cx="1010" cy="110" rx="420" ry="300" fill="url(#glow)"/>
  <circle cx="108" cy="100" r="58" fill="#8d5bdb" opacity=".06"/>
