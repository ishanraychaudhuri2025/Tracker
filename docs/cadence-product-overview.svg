    <text x="64" y="103" fill="#f7f3ff" font-size="25" font-weight="650">Build momentum. Keep what matters.</text>
    <text x="1214" y="78" fill="#a99cbf" font-size="12" text-anchor="end" letter-spacing="1.5">ILLUSTRATIVE UI OVERVIEW</text>
  </g>
